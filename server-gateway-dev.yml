spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: "EMPLOYEE-SERVICE"
            uri: lb://EMPLOYEE-SERVICE
            predicates:
              - Path=/api/v1/employees/**
          - id : "DEPARTMENT-SERVICE"
            uri: lb://DEPARTMENT-SERVICE
            predicates:
              - Path=/api/v1/department/**

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    ip-address: prefer-ip-address

logging:
  level:
    root: info


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: server-gateway
    version: 1.0.1
    description: server-gateway


# configure the api gateway for services

