spring:
  datasource:
    url: jdbc:mysql://localhost:3306/geekysoft
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate :
        format-sql: true
# logging configuration
logging:
  level:
    root:  warn


# eureka configuration
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    ip-address: preffered


# actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS
  info:
    env:
      enabled: true

info:
  app:
    name: department-service
    version: 1.0.0
    description: Department Service
