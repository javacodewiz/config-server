spring:
  datasource:
    url: jdbc:mysql://localhost:3306/geekysoft
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS
  info:
    env:
      enabled: true

info:
  app:
    name: organization-service
    version: 1.0.1
    description: Organization Service

logging:
  level:
    root: info

# eureka configuration

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    ip-address: prefer-ip-address
